    DEVICE ZXSPECTRUMNEXT

; load the 16KB core.bin into 8 KB pages 50 and 51...
; ...these are what the loader maps into MMU 4 and MMU 5, so the core runs at $8000
    MMU 4, 50
    MMU 5, 51
    ORG $8000
    INCBIN "core.bin"
    ASSERT $ = $C000, "core.bin must be exactly 16KB, build.ps1 pads it"

; populate 8 KB page 0 in slot 6 ($C000) for the bootloader
    MMU 6, 0
    ORG $C000
BootEntry:
    INCBIN "load.bin"

; load the assets...
    SLOT 4 : PAGE 10 : ORG $8000 : INCBIN "font.bin"      ; the font lives in the first 2KB of page 10, which we never map in while we run
    SLOT 4 : PAGE 60 : ORG $8000 : INCBIN "stage-init.bin"
    SLOT 4 : PAGE 68 : ORG $8000 : INCBIN "stage-left.bin"
             PAGE 69 : ORG $8000 : INCBIN "stage-right.bin"
             PAGE 70 : ORG $8000 : INCBIN "stage-centre.bin"
             PAGE 71 : ORG $8000 : INCBIN "stage-lib-demo.bin"

; save the nex file using the CLI defined NEX_FILE
; p1: filename
; p2: start address (BootEntry = $C000)
; p3: stack address (BootEntry + 8KB - 2 = $dffe)
; p4: entry bank    (bank 0 contains page 0)
; p5: file version  (2 = v1.2)
    SAVENEX OPEN NEX_FILE, BootEntry, BootEntry + $2000 - 2, 0, 2
    SAVENEX CORE 3, 1, 5 

; cfg <border>, <filehandle>, <preservenextregs>, <2RM_RAM_req>
; border: 2 (red), filehandle: 0, preserve: 1, 2MB: 1
    SAVENEX CFG 2, 0, 1, 1

; include all loaded banks in numerical sequence...
    ;SAVENEX BANK 2, 0, 25, 28, 30, 34
    SAVENEX AUTO
    SAVENEX CLOSE